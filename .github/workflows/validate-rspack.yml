name: Validate native Rspack collision guard
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Rspack fork ref to validate
        required: true
        default: fix/guard-federation-container-globals
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: '0'
      CARGO_BUILD_JOBS: '2'
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      PUPPETEER_SKIP_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          repository: tonoizer/rspack
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --global pnpm@11.28.8
      - run: pnpm install --frozen-lockfile
      - run: rustup show
      - run: cargo fmt --all --check
      - run: cargo codegen
      - run: pnpm run build:binding:dev
      - run: pnpm run build:js
      - run: pnpm --dir tests/rspack-test run test --project base -t 'container-global-collision'
